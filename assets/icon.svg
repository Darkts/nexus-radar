<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0e172a" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>

    <!-- Radar Sweep Gradient -->
    <linearGradient id="sweepGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#4facfe" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Circle -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="4" />

  <!-- Concentric Rings -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#00f2fe" stroke-opacity="0.12" stroke-width="2" stroke-dasharray="6 8" />
  <circle cx="256" cy="256" r="160" fill="none" stroke="#00f2fe" stroke-opacity="0.25" stroke-width="2" />
  <circle cx="256" cy="256" r="110" fill="none" stroke="#00f2fe" stroke-opacity="0.4" stroke-width="2" stroke-dasharray="4 6" />
  <circle cx="256" cy="256" r="60" fill="none" stroke="#00f2fe" stroke-opacity="0.6" stroke-width="2.5" />

  <!-- Crosshairs -->
  <line x1="256" y1="46" x2="256" y2="466" stroke="#00f2fe" stroke-opacity="0.25" stroke-width="2" />
  <line x1="46" y1="256" x2="466" y2="256" stroke="#00f2fe" stroke-opacity="0.25" stroke-width="2" />

  <!-- Radar Sweep Sector -->
  <path d="M 256 256 L 256 96 A 160 160 0 0 1 416 256 Z" fill="url(#sweepGrad)" opacity="0.65" />

  <!-- Blip Targets (Multi-Radars: Immo, Flight, Train) -->
  <!-- 1. Immo Blip (Emerald) -->
  <circle cx="340" cy="180" r="10" fill="#10b981" filter="url(#neonGlow)" />
  <circle cx="340" cy="180" r="22" fill="none" stroke="#10b981" stroke-opacity="0.6" stroke-width="2" />

  <!-- 2. Flight Blip (Cyan) -->
  <circle cx="170" cy="150" r="9" fill="#00f2fe" filter="url(#neonGlow)" />
  <circle cx="170" cy="150" r="20" fill="none" stroke="#00f2fe" stroke-opacity="0.6" stroke-width="2" />

  <!-- 3. Train Blip (Violet/Magenta) -->
  <circle cx="320" cy="350" r="9" fill="#ec4899" filter="url(#neonGlow)" />
  <circle cx="320" cy="350" r="20" fill="none" stroke="#ec4899" stroke-opacity="0.6" stroke-width="2" />

  <!-- Central Pulse Core -->
  <circle cx="256" cy="256" r="16" fill="#00f2fe" filter="url(#neonGlow)" />
  <circle cx="256" cy="256" r="6" fill="#ffffff" />
</svg>

