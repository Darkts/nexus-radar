<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14171F" />
      <stop offset="100%" stop-color="#090B0E" />
    </linearGradient>

    <!-- Warm Horizon / Sun Gradient (Coral to Amber - Airbnb / Apple feel) -->
    <linearGradient id="coralSun" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5A5F" />
      <stop offset="50%" stop-color="#FF7A59" />
      <stop offset="100%" stop-color="#FFA845" />
    </linearGradient>

    <!-- Travel / Seafoam Teal Gradient -->
    <linearGradient id="tealSea" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2B4" />
      <stop offset="100%" stop-color="#00A699" />
    </linearGradient>

    <!-- Subtle Glow for Depth -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" opacity="0.35" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- iOS-Style Squircle Background -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.08)" stroke-width="2.5" />

  <!-- Subtle Ambient Halo Behind Mark -->
  <circle cx="256" cy="240" r="140" fill="url(#coralSun)" opacity="0.08" filter="url(#softGlow)" />

  <!-- The "Horizons" Minimalist Emblem:
       A rising arch of discovery meeting an elegant horizon bridge -->
  <!-- 1. Rising Sun / Arc of Discovery (Coral/Amber) -->
  <path d="M 156 256 A 100 100 0 0 1 356 256" 
        fill="none" 
        stroke="url(#coralSun)" 
        stroke-width="32" 
        stroke-linecap="round" 
        filter="url(#softGlow)" />

  <!-- 2. The Luminous Sun Core at the Horizon -->
  <circle cx="256" cy="225" r="26" fill="url(#coralSun)" />

  <!-- 3. The Horizon Line (Teal Seafoam - Stability & Voyage) -->
  <line x1="124" y1="288" x2="388" y2="288" 
        stroke="url(#tealSea)" 
        stroke-width="28" 
        stroke-linecap="round" 
        filter="url(#softGlow)" />

  <!-- 4. Twin Modern Pillars (Subtle 'H' Architecture Foundation) -->
  <line x1="172" y1="288" x2="172" y2="352" 
        stroke="#FFFFFF" 
        stroke-opacity="0.85" 
        stroke-width="26" 
        stroke-linecap="round" />

  <line x1="340" y1="288" x2="340" y2="352" 
        stroke="#FFFFFF" 
        stroke-opacity="0.85" 
        stroke-width="26" 
        stroke-linecap="round" />
</svg>
