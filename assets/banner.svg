<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="50%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="radarSweep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)" />

  <!-- Cyberpunk Perspective Grid -->
  <g stroke="#00f2fe" stroke-opacity="0.08" stroke-width="1.5">
    <line x1="0" y1="320" x2="1200" y2="320" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    <line x1="0" y1="375" x2="1200" y2="375" />
    <line x1="0" y1="395" x2="1200" y2="395" />
    <!-- Perspective lines converging to center -->
    <line x1="600" y1="280" x2="-200" y2="400" />
    <line x1="600" y1="280" x2="100" y2="400" />
    <line x1="600" y1="280" x2="400" y2="400" />
    <line x1="600" y1="280" x2="800" y2="400" />
    <line x1="600" y1="280" x2="1100" y2="400" />
    <line x1="600" y1="280" x2="1400" y2="400" />
  </g>

  <!-- Right Side: Radar HUD Device -->
  <g transform="translate(980, 200)">
    <circle cx="0" cy="0" r="140" fill="none" stroke="#00f2fe" stroke-opacity="0.15" stroke-width="2" stroke-dasharray="6 8" />
    <circle cx="0" cy="0" r="100" fill="none" stroke="#00f2fe" stroke-opacity="0.3" stroke-width="1.5" />
    <circle cx="0" cy="0" r="60" fill="none" stroke="#00f2fe" stroke-opacity="0.5" stroke-width="2" />
    <line x1="0" y1="-140" x2="0" y2="140" stroke="#00f2fe" stroke-opacity="0.3" stroke-width="1.5" />
    <line x1="-140" y1="0" x2="140" y2="0" stroke="#00f2fe" stroke-opacity="0.3" stroke-width="1.5" />
    <path d="M 0 0 L 0 -100 A 100 100 0 0 1 100 0 Z" fill="url(#radarSweep)" opacity="0.45" />
    <!-- Blips -->
    <circle cx="50" cy="-40" r="6" fill="#10b981" filter="url(#neonGlow)" />
    <circle cx="-60" cy="-30" r="5" fill="#00f2fe" filter="url(#neonGlow)" />
    <circle cx="40" cy="70" r="5" fill="#ec4899" filter="url(#neonGlow)" />
    <circle cx="0" cy="0" r="10" fill="#00f2fe" filter="url(#neonGlow)" />
  </g>

  <!-- Left Side: Tech Badge -->
  <g transform="translate(80, 75)">
    <rect width="210" height="32" rx="16" fill="rgba(0, 242, 254, 0.1)" stroke="#00f2fe" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="20" cy="16" r="5" fill="#10b981" filter="url(#neonGlow)" />
    <text x="36" y="21" fill="#38bdf8" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" letter-spacing="2">LIVE RADAR HUB</text>
  </g>

  <!-- Main Title -->
  <text x="80" y="175" fill="url(#cyanPurple)" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="64" letter-spacing="-1" filter="url(#neonGlow)">NEXUS RADAR</text>

  <!-- Subtitle -->
  <text x="82" y="225" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="18" letter-spacing="4">AUTONOMOUS MULTI-CATEGORY HUNTING ENGINE</text>

  <!-- Category Badges -->
  <g transform="translate(80, 265)">
    <!-- Immo Badge -->
    <rect x="0" y="0" width="165" height="38" rx="10" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" stroke-opacity="0.5" stroke-width="1" />
    <text x="18" y="24" fill="#34d399" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="14">🏠 IMMO SXM</text>

    <!-- Flight Badge -->
    <rect x="180" y="0" width="165" height="38" rx="10" fill="rgba(0, 242, 254, 0.15)" stroke="#00f2fe" stroke-opacity="0.5" stroke-width="1" />
    <text x="198" y="24" fill="#38bdf8" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="14">✈️ VOLS FLASH</text>

    <!-- Train Badge -->
    <rect x="360" y="0" width="180" height="38" rx="10" fill="rgba(236, 72, 153, 0.15)" stroke="#ec4899" stroke-opacity="0.5" stroke-width="1" />
    <text x="378" y="24" fill="#f472b6" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="14">🚄 TRAINS OUIGO</text>
  </g>

  <!-- Decorative Corner HUD markings -->
  <path d="M 30 60 L 30 30 L 60 30" stroke="#00f2fe" stroke-width="2.5" fill="none" opacity="0.7" />
  <path d="M 1170 60 L 1170 30 L 1140 30" stroke="#00f2fe" stroke-width="2.5" fill="none" opacity="0.7" />
  <path d="M 30 340 L 30 370 L 60 370" stroke="#00f2fe" stroke-width="2.5" fill="none" opacity="0.7" />
  <path d="M 1170 340 L 1170 370 L 1140 370" stroke="#00f2fe" stroke-width="2.5" fill="none" opacity="0.7" />
</svg>

